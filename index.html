<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Boot</title>

<!-- Font Awesome 6 Free: full library (solid, regular, brands). It turns every <i class="fa-..."> into an icon. -->
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/js/all.min.js"></script>

<style>
  /* =====================================================================
     ✏️  EDIT HERE: LOOK & FEEL
     ===================================================================== */
  :root {
    --background:  #000000;           /* screen colour                          */
    --logo-color:  #ffffff;           /* icon colour                            */
    --logo-size:   min(26vw, 108px);  /* icon size (e.g. 120px, 30vw)           */
    --bar-width:   min(40vw, 160px);  /* progress bar length                    */
    --bar-height:  4px;               /* progress bar thickness                 */
    --bar-track:   #3a3a3c;           /* empty part of the bar                  */
    --bar-fill:    #ffffff;           /* filled part of the bar                 */
    --bar-gap:     15vh;              /* space between icon and bar             */
  }
  /* ===================================================================== */

  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; } }
  :root[data-theme="dark"] { color-scheme: dark; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }

  *, *::before, *::after { box-sizing: inherit; margin: 0; padding: 0; }
  html, body {
    height: 100%; background: var(--background); overflow: hidden; overscroll-behavior: none;
    touch-action: manipulation; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  body { position: relative; cursor: none; }

  /* App wrapper: this is the element that goes full screen */
  #app { position: fixed; inset: 0; background: var(--background); overflow: hidden; }
  #app:fullscreen          { width: 100vw; height: 100vh; background: var(--background); }
  #app:-webkit-full-screen { width: 100vw; height: 100vh; background: var(--background); }
  ::backdrop               { background: var(--background); }

  /* Boot stage */
  .stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .logo {
    width: var(--logo-size); height: var(--logo-size);
    display: flex; align-items: center; justify-content: center;
    color: var(--logo-color); opacity: 0; transition: opacity 900ms ease-out;
  }
  .logo.on { opacity: 1; }
  .logo svg, .logo img { width: 100%; height: 100%; object-fit: contain; display: block; }

  .progress {
    position: absolute; left: 50%; top: calc(50% + var(--logo-size) * 0.5 + var(--bar-gap));
    transform: translateX(-50%); width: var(--bar-width); height: var(--bar-height);
    border-radius: var(--bar-height); background: var(--bar-track); overflow: hidden;
    opacity: 0; transition: opacity 400ms ease-out;
  }
  .progress.on { opacity: 1; }
  .progress span { display: block; height: 100%; width: 0%; background: var(--bar-fill); border-radius: inherit; transition: width 500ms linear; }

  body.off .logo, body.off .progress { opacity: 0 !important; transition: opacity 250ms ease-in; }

  /* Hidden corner buttons: same colour as the background */
  .ghost {
    position: fixed; top: 0; z-index: 10;
    width: calc(64px + env(safe-area-inset-left, 0px)); height: calc(64px + env(safe-area-inset-top, 0px));
    padding-top: env(safe-area-inset-top, 0px); border: 0; background: transparent; color: var(--background);
    display: flex; align-items: center; justify-content: center; cursor: none; outline: none;
    -webkit-appearance: none; appearance: none;
  }
  .ghost svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }
  .ghost.left  { left: 0;  padding-left: env(safe-area-inset-left, 0px); }
  .ghost.right { right: 0; width: calc(64px + env(safe-area-inset-right, 0px)); padding-right: env(safe-area-inset-right, 0px); }
  .ghost:focus-visible { color: #2c2c2e; }

  @media (prefers-reduced-motion: reduce) { .logo, .progress, .progress span { transition: none; } }
</style>
</head>
<body>
<div id="app">

  <!-- Hidden CLOSE button (top-left): turns the screen "off". Tap anywhere to boot again. -->
  <button class="ghost left" id="closeBtn" aria-label="Close">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>

  <!-- Hidden FULL SCREEN button (top-right) -->
  <button class="ghost right" id="fsBtn" aria-label="Toggle full screen">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
  </button>

  <main class="stage" aria-label="Starting up">
    <div class="logo" id="logo" aria-hidden="true">

      <!-- =================================================================
           ✏️  EDIT HERE: LOGO
           Change the class below to any Font Awesome 6 Free icon.
           Browse icons: https://fontawesome.com/search?ic=free
           Examples:
             <i class="fa-solid fa-bolt"></i>
             <i class="fa-regular fa-sun"></i>
             <i class="fa-brands fa-github"></i>

           Prefer your own image? Delete the <i> line and use:
             <img src="my-logo.png" alt="">
           ================================================================= -->
      <i class="fa-brands fa-apple"></i>
      <!-- ================================================================= -->

    </div>
    <div class="progress" id="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="fill"></span></div>
  </main>
</div>

<script>
/* =======================================================================
   ✏️  EDIT HERE: BOOT TIMING
   Each pair is [milliseconds after start, percent filled].
   Uneven gaps make it feel like a real boot (stalls, then bursts).
   ======================================================================= */
var LOGO_APPEARS_AT = 500;    // ms before the logo fades in
var BAR_APPEARS_AT  = 1400;   // ms before the progress bar shows
var BOOT_STEPS = [
  [1600, 4], [2100, 9], [2600, 14], [3800, 18], [4200, 31], [4600, 38],
  [6200, 41], [6700, 55], [7100, 63], [7500, 70], [8900, 74], [9300, 86],
  [9900, 92], [11200, 97], [12000, 100]
];
/* ======================================================================= */


/* ----- Nothing below needs editing ----- */
(function () {
  var body = document.body;
  var logo = document.getElementById('logo');
  var bar  = document.getElementById('progress');
  var fill = document.getElementById('fill');
  var app  = document.getElementById('app');
  var timers = [], wakeLock = null;
  var state = { logo: false, bar: false, percent: 0 };

  function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
  function clearAll() { timers.forEach(clearTimeout); timers = []; }

  function boot() {
    clearAll();
    body.classList.remove('off');
    state = { logo: false, bar: false, percent: 0 };
    logo.classList.remove('on');
    bar.classList.remove('on');
    fill.style.transition = 'none'; fill.style.width = '0%'; void fill.offsetWidth; fill.style.transition = '';
    later(function () { state.logo = true; logo.classList.add('on'); }, LOGO_APPEARS_AT);
    later(function () { state.bar = true; bar.classList.add('on'); }, BAR_APPEARS_AT);
    BOOT_STEPS.forEach(function (s) {
      later(function () { state.percent = s[1]; fill.style.width = s[1] + '%'; bar.setAttribute('aria-valuenow', s[1]); }, s[0]);
    });
  }

  // If Font Awesome can't load (offline) or the class name is wrong, show a plain ring instead of nothing
  window.addEventListener('load', function () {
    setTimeout(function () {
      var leftover = logo.querySelector('i');
      var missing = logo.querySelector('svg.missing, svg [class*="missing"]');
      if (leftover || missing) {
        logo.innerHTML = '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="currentColor" stroke-width="9"/><circle cx="50" cy="50" r="15" fill="currentColor"/></svg>';
        console.warn('Logo icon not found. Check the class name in the "EDIT HERE: LOGO" section.');
      }
    }, 300);
  });

  // Full screen
  function isFull() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
  var inFrame = (function () { try { return window.self !== window.top; } catch (e) { return true; } })();
  function popOut() { if (inFrame) { try { window.open(location.href, '_blank'); } catch (e) {} } }
  function enterFull() {
    var req = app.requestFullscreen || app.webkitRequestFullscreen;
    if (!req) { popOut(); return; }
    try {
      var p = req.call(app, { navigationUI: 'hide' });
      if (p && p.catch) p.catch(popOut);
    } catch (e) { popOut(); }
  }

  // After entering or leaving full screen, put the logo and bar back exactly where they were
  function restore() {
    if (body.classList.contains('off')) return;
    logo.classList.toggle('on', state.logo);
    bar.classList.toggle('on', state.bar);
    fill.style.transition = 'none';
    fill.style.width = state.percent + '%';
    void app.offsetWidth;            // force the browser to repaint
    fill.style.transition = '';
  }
  document.addEventListener('fullscreenchange', restore);
  document.addEventListener('webkitfullscreenchange', restore);
  function exitFull() {
    var ex = document.exitFullscreen || document.webkitExitFullscreen;
    if (ex && isFull()) { try { var p = ex.call(document); if (p && p.catch) p.catch(function () {}); } catch (e) {} }
  }

  // Keep the screen from dimming
  function keepAwake() {
    try {
      if ('wakeLock' in navigator && !wakeLock) {
        navigator.wakeLock.request('screen').then(function (l) { wakeLock = l; l.addEventListener('release', function () { wakeLock = null; }); }).catch(function () {});
      }
    } catch (e) {}
  }
  function releaseAwake() { try { if (wakeLock) wakeLock.release(); } catch (e) {} wakeLock = null; }

  document.getElementById('fsBtn').addEventListener('click', function (e) {
    e.stopPropagation(); keepAwake(); if (isFull()) exitFull(); else enterFull();
  });
  document.getElementById('closeBtn').addEventListener('click', function (e) {
    e.stopPropagation(); clearAll(); exitFull(); releaseAwake(); body.classList.add('off');
  });

  // Tap a black (closed) screen to boot again; double-tap anytime to restart
  var lastTap = 0;
  document.addEventListener('click', function () {
    keepAwake();
    if (body.classList.contains('off')) { boot(); return; }
    var now = Date.now();
    if (now - lastTap < 350) boot();
    lastTap = now;
  });

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && !body.classList.contains('off')) keepAwake();
  });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });

  boot();
})();
</script>
</body>
</html>
